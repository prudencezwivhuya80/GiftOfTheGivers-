trigger:
  branches:
    include:
      - master

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:
- task: UseDotNet@2
  displayName: 'Install .NET 9 SDK'
  inputs:
    packageType: 'sdk'
    version: '9.0.x'

- task: UseDotNet@2
  displayName: 'Install .NET 8 Runtime'
  inputs:
    packageType: 'runtime'
    version: '8.0.x'

- powershell: |
    Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
    ./dotnet-install.ps1 -Runtime aspnetcore -Channel 8.0 -InstallDir "C:\hostedtoolcache\windows\dotnet"
  displayName: 'Install ASP.NET Core 8 Runtime'

- task: NuGetAuthenticate@1
  displayName: 'Authenticate to Azure Artifacts'

- task: DotNetCoreCLI@2
  displayName: 'Restore dependencies'
  inputs:
    command: 'restore'
    projects: '**/*.sln*'
    feedsToUse: 'config'
    nugetConfigPath: 'nuget.config'

- task: DotNetCoreCLI@2
  displayName: 'Build solution'
  inputs:
    command: 'build'
    projects: '**/*.sln*'
    arguments: '--configuration $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: 'Run unit and integration tests'
  inputs:
    command: 'test'
    projects: '**/*Tests.csproj'
    arguments: '--configuration $(buildConfiguration) --filter "Category!=UI"'

- task: DotNetCoreCLI@2
  displayName: 'Publish web app'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: 'GiftOfTheGivers/GiftOfTheGivers.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/web'
    zipAfterPublish: true

- task: DotNetCoreCLI@2
  displayName: 'Publish function app'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: 'GiftOfTheGivers.Functions/GiftOfTheGivers.Functions.csproj'
    arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/functions'
    zipAfterPublish: true

- script: >
    sqlcmd -S tcp:giftofthegivers-zee-server.database.windows.net,1433
    -d GiftOfTheGiversDB
    -U $(sqlUser) -P $(sqlPassword)
    -i GiftOfTheGivers/migration.sql -b
  displayName: 'Apply database migration script to Azure SQL'

- task: AzureWebApp@1
  displayName: 'Deploy to Azure App Service'
  inputs:
    azureSubscription: 'GiftOfTheGiversAzure'
    appType: 'webApp'
    appName: 'giftofthegivers-zee'
    package: '$(Build.ArtifactStagingDirectory)/web/*.zip'

- task: AzureFunctionApp@2
  displayName: 'Deploy to Azure Function App'
  inputs:
    connectedServiceNameARM: 'GiftOfTheGiversAzure'
    appType: 'functionApp'
    appName: 'giftofgivers-function'
    package: '$(Build.ArtifactStagingDirectory)/functions/*.zip'